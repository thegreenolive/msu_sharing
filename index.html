<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="coi-serviceworker.js"></script>
<title>Python Lab</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #eee;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 8px 12px; background: #2d2d2d; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  button { background: #0e639c; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:disabled { background: #444; cursor: default; }
  button.secondary { background: #555; }
  button.danger { background: #b33a3a; }
  #status { font-size: 12px; color: #aaa; }
  #warn { display: none; background: #8a4b00; padding: 6px 12px; font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }

  /* Left: exercise tabs + editors with line numbers */
  #left { flex: 1; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #333; }
  #tabs { display: flex; background: #2d2d2d; border-bottom: 1px solid #333; overflow-x: auto; }
  .tab { background: transparent; color: #bbb; border: 0; border-radius: 0; padding: 8px 16px; font-size: 13px; }
  .tab.active { background: #1e1e1e; color: #fff; border-bottom: 2px solid #0e639c; }

  .editor-wrap { flex: 1; display: flex; min-height: 0; }
  .editor-wrap[hidden] { display: none; }
  .gutter { background: #252526; color: #858585; font-family: Consolas, "Courier New", monospace;
            font-size: 15px; line-height: 20px; padding: 12px 10px 12px 12px; text-align: right;
            overflow: hidden; user-select: none; white-space: pre; border-right: 1px solid #333; }
  .editor { flex: 1; background: #1e1e1e; color: #d4d4d4; border: 0; padding: 12px;
            font-family: Consolas, "Courier New", monospace; font-size: 15px; line-height: 20px;
            resize: none; outline: none; tab-size: 4; white-space: pre; overflow: auto; }

  /* Right: output */
  #output { flex: 1; margin: 0; padding: 12px; background: #111; font-family: Consolas, "Courier New", monospace;
            font-size: 14px; white-space: pre-wrap; overflow: auto; min-width: 0; }
  .err { color: #ff6b6b; }

  @media (max-width: 700px) {
    main { flex-direction: column; }
    #left { border-right: 0; border-bottom: 1px solid #333; }
  }
</style>
</head>
<body>
<header>
  <h1>Python Lab</h1>
  <span id="status">Loading Python...</span>
  <button id="run" disabled>Run (Ctrl+Enter)</button>
  <button id="stop" class="danger" disabled>Stop</button>
  <button class="secondary" id="clear">Clear output</button>
  <button class="secondary" id="dlCode">Download code</button>
</header>
<div id="warn"></div>
<main>
  <div id="left">
    <div id="tabs">
      <button class="tab active" data-index="0">Exercise 1</button>
      <button class="tab" data-index="1">Exercise 2</button>
      <button class="tab" data-index="2">Exercise 3</button>
      <button class="tab" data-index="3">Test 1</button>
      <button class="tab" data-index="4">Test 2</button>
    </div>
    <div class="editor-wrap" data-index="0">
      <div class="gutter"></div>
      <textarea class="editor" data-index="0" wrap="off" spellcheck="false" placeholder="Exercise 1: write your code here..."></textarea>
    </div>
    <div class="editor-wrap" data-index="1" hidden>
      <div class="gutter"></div>
      <textarea class="editor" data-index="1" wrap="off" spellcheck="false" placeholder="Exercise 2: write your code here..."></textarea>
    </div>
    <div class="editor-wrap" data-index="2" hidden>
      <div class="gutter"></div>
      <textarea class="editor" data-index="2" wrap="off" spellcheck="false" placeholder="Exercise 3: write your code here..."></textarea>
    </div>
    <div class="editor-wrap" data-index="3" hidden>
      <div class="gutter"></div>
      <textarea class="editor" data-index="3" wrap="off" spellcheck="false" placeholder="Test 1: write your code here..."></textarea>
    </div>
    <div class="editor-wrap" data-index="4" hidden>
      <div class="gutter"></div>
      <textarea class="editor" data-index="4" wrap="off" spellcheck="false" placeholder="Test 2: write your code here..."></textarea>
    </div>
  </div>
  <pre id="output"></pre>
</main>

<script>
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
const LOG_KEY = "pylab-activity-log";
const CODE_KEY_PREFIX = "pylab-code-ex";
const RUNS_KEY = "pylab-runs";

const output = document.getElementById("output");
const statusEl = document.getElementById("status");
const runBtn = document.getElementById("run");
const stopBtn = document.getElementById("stop");
const warn = document.getElementById("warn");
const editors = [...document.querySelectorAll("textarea.editor")];
const wraps = [...document.querySelectorAll(".editor-wrap")];
const tabs = [...document.querySelectorAll(".tab")];

let worker = null;
// input() needs SharedArrayBuffer, which browsers allow only on a cross-origin-isolated page
// (set up by coi-serviceworker on GitHub Pages; not available when opened as a local file).
const sharedBuf = (typeof SharedArrayBuffer !== "undefined" && self.crossOriginIsolated)
  ? new SharedArrayBuffer(8 + 65536) : null;
let pyReady = false;
let running = false;
let activeIndex = 0;

function activeEditor() { return editors[activeIndex]; }

// ---------- Python worker ----------
// Python runs in a Web Worker so the page stays responsive during an infinite loop.
// The Stop button terminates the worker and starts a fresh one.
const WORKER_SRC = `
importScripts("${PYODIDE_URL}");
let ctrl = null, data = null;
const ready = loadPyodide({
  stdout: t => postMessage({ type: "out", text: t }),
  stderr: t => postMessage({ type: "err", text: t }),
  stdin: () => {
    if (!ctrl) {
      postMessage({ type: "err", text: "input() only works when the lab is opened from its web address, not as a local file." });
      return "";
    }
    postMessage({ type: "input" });
    Atomics.store(ctrl, 0, 0);
    Atomics.wait(ctrl, 0, 0);          // block until the main page answers
    return new TextDecoder().decode(data.slice(0, ctrl[1]));
  }
}).then(async py => {
  await py.runPythonAsync('import builtins; builtins.help = lambda *a, **k: print("help() is disabled in this lab.")');
  return py;
});
ready.then(() => postMessage({ type: "ready" }), e => postMessage({ type: "fatal", text: String(e) }));

onmessage = async e => {
  if (e.data.type === "init") {
    ctrl = new Int32Array(e.data.buf, 0, 2);
    data = new Uint8Array(e.data.buf, 8);
    return;
  }
  if (e.data.type !== "run") return;
  let py;
  try { py = await ready; } catch (err) { postMessage({ type: "done" }); return; }
  const ns = py.globals.get("dict")();   // fresh namespace each run
  try {
    await py.runPythonAsync(e.data.code, { globals: ns });
  } catch (err) {
    postMessage({ type: "err", text: String(err.message || err) });   // real Python traceback
  } finally {
    ns.destroy();
    postMessage({ type: "done" });
  }
};
`;

function startWorker() {
  pyReady = false;
  setButtons();
  statusEl.textContent = "Loading Python...";
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
  worker = new Worker(url);
  worker.onmessage = onWorkerMessage;
  worker.onerror = e => { statusEl.textContent = "Python error: " + (e.message || "could not start"); };
  if (sharedBuf) worker.postMessage({ type: "init", buf: sharedBuf });
}

function onWorkerMessage(e) {
  const m = e.data;
  if (m.type === "input") answerInput();
  else if (m.type === "out") appendOut(m.text);
  else if (m.type === "err") appendOut(m.text, true);
  else if (m.type === "ready") { pyReady = true; statusEl.textContent = "Ready"; setButtons(); }
  else if (m.type === "done") {
    running = false;
    if (pyReady) statusEl.textContent = "Ready";
    setButtons();
  }
  else if (m.type === "fatal") { statusEl.textContent = "Python failed to start: " + m.text; }
}

function answerInput() {
  const ctrl = new Int32Array(sharedBuf, 0, 2);
  const bytes = new Uint8Array(sharedBuf, 8);
  const text = window.prompt("Your program is asking for input:") ?? "";
  const encoded = new TextEncoder().encode(text).slice(0, 65536);
  bytes.set(encoded);
  ctrl[1] = encoded.length;
  Atomics.store(ctrl, 0, 1);           // wake the worker
  Atomics.notify(ctrl, 0);
}

function setButtons() {
  runBtn.disabled = !pyReady || running;
  stopBtn.disabled = !running;
}

function runCode() {
  if (!pyReady || running) return;
  saveRun();
  output.textContent = "";
  running = true;
  statusEl.textContent = "Running...";
  setButtons();
  worker.postMessage({ type: "run", code: activeEditor().value });
}

function stopRun() {
  if (!running) return;
  worker.terminate();          // kills the loop even if it never yields
  running = false;
  appendOut("Program stopped with the Stop button.", true);
  startWorker();               // fresh Python for the next run
}

runBtn.addEventListener("click", runCode);
stopBtn.addEventListener("click", stopRun);
document.getElementById("clear").addEventListener("click", () => { output.textContent = ""; });

// ---------- Output ----------
function appendOut(text, isError = false) {
  const span = document.createElement("span");
  if (isError) span.className = "err";
  span.textContent = text + (text.endsWith("\n") ? "" : "\n");
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

// ---------- Run history (kept until the student downloads) ----------
let runs = [];
try { runs = JSON.parse(localStorage.getItem(RUNS_KEY) || "[]"); } catch (e) { runs = []; }

function saveRun() {
  runs.push({ time: new Date().toLocaleString(), codes: editors.map(ed => ed.value) });
  try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs)); } catch (e) {}
}

// ---------- Activity log (kept on this computer, warning shown to student) ----------
function getLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch (e) { return []; }
}
function logEvent(type) {
  const log = getLog();
  log.push({ time: new Date().toISOString(), event: type });
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) {}
}
function refreshWarning() {
  const n = getLog().filter(e => e.event === "left_page").length;
  if (n > 0) {
    warn.style.display = "block";
    warn.textContent = `Leaving this page has been recorded (${n} time${n === 1 ? "" : "s"}).`;
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) logEvent("left_page");
  refreshWarning();
});
window.addEventListener("blur", () => logEvent("focus_lost"));

// ---------- Download all runs (one .txt file) ----------
document.getElementById("dlCode").addEventListener("click", () => {
  if (runs.length === 0) {
    alert("No runs yet. Press Run first.");
    return;
  }
  const text = runs.map((r, i) =>
    `===== Run ${i + 1} (${r.time}) =====\n` +
    r.codes.map((c, j) => `----- ${tabs[j].textContent.trim()} -----\n${c}`).join("\n\n")
  ).join("\n\n\n");
  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "exercises.txt";
  a.click();
  URL.revokeObjectURL(a.href);
});

// ---------- Line numbers ----------
function updateGutter(i) {
  const ed = editors[i];
  const gutter = wraps[i].querySelector(".gutter");
  const count = ed.value.split("\n").length;
  let nums = "";
  for (let n = 1; n <= count; n++) nums += n + "\n";
  gutter.textContent = nums.trimEnd();
  gutter.scrollTop = ed.scrollTop;
}

// ---------- Editors ----------
editors.forEach((ed, i) => {
  ed.value = localStorage.getItem(CODE_KEY_PREFIX + (i + 1)) || "";
  updateGutter(i);

  ed.addEventListener("input", () => {
    try { localStorage.setItem(CODE_KEY_PREFIX + (i + 1), ed.value); } catch (e) {}
    updateGutter(i);
  });
  ed.addEventListener("scroll", () => {
    wraps[i].querySelector(".gutter").scrollTop = ed.scrollTop;
  });
  ed.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = ed.selectionStart;
      ed.value = ed.value.slice(0, s) + "    " + ed.value.slice(ed.selectionEnd);
      ed.selectionStart = ed.selectionEnd = s + 4;
      ed.dispatchEvent(new Event("input"));
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      runCode();
    }
  });
});

// ---------- Tabs ----------
tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    activeIndex = Number(tab.dataset.index);
    tabs.forEach((t, i) => t.classList.toggle("active", i === activeIndex));
    wraps.forEach((w, i) => { w.hidden = i !== activeIndex; });
    activeEditor().focus();
  });
});

// ---------- Start ----------
startWorker();
</script>
</body>
</html>
